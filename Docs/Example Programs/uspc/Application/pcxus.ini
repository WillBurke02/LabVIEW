[Type]
SETUP_PCXUS
VERSION=7.0
/* OEM Bitmap
/* ----------
[Pictures]
backpanel_picture=C:\uspc\config\back panel PCXUS.bmp
/* Files to be loaded into PCXUS
/* -----------------------------
/* If all board use the same file, you must only set CONFIG1_default
/* CONFIG2_default and CONFIG3_default
/* If a board use a specific file you must set the paths files like:
/*  CONFIG1x=path
/*  CONFIG2x=path
/*  CONFIG3x=path
/*  where x is board number
/*  When path="NULL then any file is loaded"
/*
/* Peak detector frequency
/* -----------------------
/* Define the blanking erea allowing the separation of two consecutive
/* echoes over the same Gate threshold (First & Max Peak)
/*  Size is="NSIZE * 1/Pulse Signal frequency"
/*  NSIZE="5.0 (factory setting)"
/*  
/* +6dB shift of the full gain dynamic on 5.0MHz filter only 
/* ---------------------------------------------------------
/*  SHIFT_6dB=OFF (factory setting)
/*
/* WAVE_MATCHING
/* ------------
/* WAVE_MATCHING=ON/OFF  
/*
/* This parameter common to all cards into the computer must be turned ON for GE specifications
/* in order to pop up a window in Ascan, GateIF, Gate1 or Gate2 functions each time a Wave selected 
/* does not Match with others.


[boot]
CONFIG1_default=C:\uspc\config\config63.cod
CONFIG2_default=C:\uspc\config\config297.cod
CONFIG3_default=C:\uspc\config\config502.cod
NSIZE=5.0
SHIFT_6dB=OFF
WAVE_MATCHING=OFF

/* Boards setting
/* ---------------
[Board i]
/* SN="Serial number"
/*
/* EXTERNAL BOARD="none or RCPP or MUX_LOW_VERSION or MUX_HIGH_VERSION"
/*                  If EXTERNAL BOARD isn't defined then the default mode is "none".
/*
/* MUX_DAC="Independant DAC per channel ENABLE or DISABLE"
/*                  This flag is used for MUX MH+/MHC+/MHA+
/*                  When DISABLE the DAC function is disabled for all channel
/*                  Remark: The DAC curve is a common parameter for others MUX models.
/*                  If MUX_DAC isn't defined then the default mode is DISABLE.
/*
/* COM="Port number (when MUX and RCPP are using)"
/*
/* START="MASTER or SLAVE or MASTER_LINK"
/*                  MASTER : you can use StartOut trigger to synchronize a slave board
/*                  SLAVE : a slave board needs a trigger signal on StartIn
/*                  MASTER_LINK : Enable PRF LINK output signal to connect to PRF IN
/*                  If START isn't defined then the default mode is MASTER.
/*
/* DigitMode=AUTO/ON/OFF
/*                  ON    resolution is always High
/*                  OFF   resolution is always Low
/*                  AUTO  resolution is automaticly switched High or Low (factory setting)
/*                    according to the receiver filter setting.
/*                    resolution is switched Low from 500 KHz to 5 MHz
/*                    resolution is switched High from 10 MHz to wide band
/*                  Remark: With a MUX board the resolution is automaticaly switched Low
/*                  when DigitMode=AUTO.
/*                  If DigitMode isn't defined then the default mode is OFF.
/*
/* FORMAT_WT_IF="Define WT output format of gate IF into data stream"
/*                  8="8  bits"
/*                  16="16 bits"
/*
/* FORMAT_WT_1="Define WT output format of gate 1 into data stream"
/*                  8="8  bits"
/*                  16="16 bits Warning: In this case the WT MSB replaces quality of coupling"
/*
/* FORMAT_WT_2="Define WT output format of gate 2 into data stream"
/*                  8="8  bits"
/*                  16="16 bits Warning: In this case the WT MSB replaces quality of coupling"
/*
/*                  If Format_WT_xx isn't defined then the default format is 8 bits
/*
[/Board i]
/*


[Board 1]
SN=5245
EXTERNAL BOARD=MUX_LOW_VERSION
COM=9
START=MASTER
DigitMode=AUTO
FORMAT_WT_IF=16
FORMAT_WT_1=16
FORMAT_WT_2=16
[/Board 1]


/* Default assignment of HE10 pins connector
/* -----------------------------------------
/*  codes   function
/*
/*  1000    Type analog output
/*==========================
/*  1999    Not used (Ana. output)
/*  1000    Analog amplitude of gate 1
/*  1001    Analog amplitude of gate 2
/*  1002    Analog tickness of gate 1
/*  1003    Analog tickness of gate 2
/*  1004    Analog couplage of gate 1
/*  1005    Analog couplage of gate 2
/*  1006    Extension Gate 1
/*  1007    Extension Gate 2
/*  1008    Analog tickness of gate IF
/*  1009    Analog couplage of gate IF
/*  1010    Extension Gate 3
/*
/*  2000    Type digital output
/*===========================
/*  2999    Not used (TTL output)
/*  2000    Card ready
/*  2001    Alarm of gate IF
/*  2002    Alarm of gate 1
/*  2003    Alarm of gate 2
/*  2004    Alarm thickness mini. of gate 1
/*  2005    Alarm thickness mini. of gate 2
/*  2006    Alarm thickness maxi. of gate 1
/*  2007    Alarm thickness maxi. of gate 2
/*  2008    Alarm couplage of gate 1
/*  2009    Alarm couplage of gate 2
/*  2010    Alarm tickness mini. of gate IF
/*  2011    Alarm tickness maxi. of gate IF
/*  2012    Alarm couplage of gate IF
/*
/*  3000    Type digital input
/*==========================
/*  3000    Not used (TTL input)
/*
/*  4000    Type not selectable
/*===========================
/*  4000    Ground
/*  4001    + 5 V
/*  4002    Output synchro.
/*  4003    External synchro.
/*  4004    Start out
/*  4005    Start in
/*  4006    PRF_LINK
/*
/*  Selection possibilities
/*=======================
/*  Pin1 serie 1000 only
/*  Pin2 serie 1000 only
/*  Pin3 serie 1000 only
/*  Pin4 serie 1000 only
/*  **  Pin5 4003 only
/*  **  Pin6 3000 only
/*  Pin7 serie 2000 only
/*  Pin8 serie 2000 only
/*  Pin9 serie 2000 only
/*  Pin10 serie 2000 only
/*  Pin11 serie 2000 only
/*  Pin12 serie 2000 only
/*  **  Pin13 4000 only
/*  **  Pin14 4000 only
/*  Pin15 serie 2000 only
/*  **  Pin16 4001 only
/*  **  Pin17 4004 only
/*  Pin18 serie 2000 only
/*  Pin19 serie 2000 only
/*  **  Pin20 serie 2000 only
/*  **  Pin21 4002 only
/*  **  Pin22 4005 only
/*  Pin23 serie 1000 only
/*  Pin24 serie 1000 only
/*  Pin25 serie 1000 only
/*  Pin26 serie 1000 only
/*
/*  **  NB: pins 5, 6, 13, 14, 16, 17, 20, 21 and 22 are not selectables
[Pins assignment]
